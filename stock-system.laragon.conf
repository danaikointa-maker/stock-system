# =========================================================
# Stock System - Laragon Nginx site
#
# PUT THIS FILE AT:
#   C:/app/etc/nginx/sites-enabled/stock-system.conf
#
# NOT in the alias/ folder - your nginx.conf does not include it:
#     include "C:/app/etc/nginx/php_upstream.conf";
#     include "C:/app/etc/nginx/sites-enabled/*.conf";
#
# That is why the previous config was never loaded and every
# URL returned Laragon's own 404 page.
#
# URL after installing this file:
#   http://stock-system.test
#
# Document root:
#   C:/app/project/stock-system/public
#
# ---------------------------------------------------------
# AFTER COPYING THIS FILE
#
# 1. Reload Nginx in Laragon (right-click tray icon > Nginx > Reload)
#
# 2. Make sure Windows resolves the hostname. Laragon usually adds it
#    automatically. If not, right-click Laragon > Tools > Hosts file,
#    or add this line to C:\Windows\System32\drivers\etc\hosts :
#
#        127.0.0.1  stock-system.test
#
# 3. Set the address in C:/app/project/stock-system/.env
#
#        APP_URL=http://stock-system.test
#
#    then run:  php artisan config:clear
# =========================================================

server {
    listen 80;
    server_name stock-system.test *.stock-system.test;

    root "C:/app/project/stock-system/public";
    index index.php index.html index.htm;

    charset utf-8;

    # Laravel front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Block dotfiles such as .env and .git
    location ~ /\. {
        deny all;
    }

    # Do not log noise
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass php_upstream;
        fastcgi_index index.php;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        # Parameters are written out in full on purpose.
        # "include fastcgi_params;" is resolved relative to the nginx
        # prefix folder and is not reliable from sites-enabled.
        fastcgi_param SCRIPT_FILENAME    $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO          $fastcgi_path_info;
        fastcgi_param DOCUMENT_ROOT      $document_root;
        fastcgi_param QUERY_STRING       $query_string;
        fastcgi_param REQUEST_METHOD     $request_method;
        fastcgi_param CONTENT_TYPE       $content_type;
        fastcgi_param CONTENT_LENGTH     $content_length;
        fastcgi_param SCRIPT_NAME        $fastcgi_script_name;
        fastcgi_param REQUEST_URI        $request_uri;
        fastcgi_param DOCUMENT_URI       $document_uri;
        fastcgi_param SERVER_PROTOCOL    $server_protocol;
        fastcgi_param REQUEST_SCHEME     $scheme;
        fastcgi_param HTTPS              $https if_not_empty;
        fastcgi_param GATEWAY_INTERFACE  CGI/1.1;
        fastcgi_param SERVER_SOFTWARE    nginx/$nginx_version;
        fastcgi_param REMOTE_ADDR        $remote_addr;
        fastcgi_param REMOTE_PORT        $remote_port;
        fastcgi_param SERVER_ADDR        $server_addr;
        fastcgi_param SERVER_PORT        $server_port;
        fastcgi_param SERVER_NAME        $server_name;
        fastcgi_param REDIRECT_STATUS    200;

        # Laravel can send large headers after login
        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 16k;
        fastcgi_read_timeout 300;
    }

    access_log "C:/app/etc/nginx/logs/stock-system.access.log";
    error_log  "C:/app/etc/nginx/logs/stock-system.error.log";
}
